<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pessôa Tattoo</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&amp;family=Jost:wght@300;400;500&amp;family=UnifrakturCook:wght@700&amp;display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- ================================================================
       HEADER
       
       ================================================================ -->
    <header class="header" id="mbHeader">
      <!-- Faixa utilitária superior -->

      <div class="nav-left" onclick="location.href = 'index.html'">
        <div class="logo">
          <img src="img/logo.png" alt="logo pessoa-tatoo" />
        </div>
      </div>

      <nav class="main-nav">
        <div class="nav-links">
          <a href="index.html" class="active">Home</a>
          <a href="#galeria">Galeria</a>
          <a href="sobre.html">Sobre</a>
          <a href="contato.html">Contato</a>
          <a href="Endereço.html">Endereço</a>
        </div>
      </nav>

      <div class="utility-strip">
        <span class="social">
          <a
            href="https://www.instagram.com/pessoalucastattoo?utm_source=ig_web_button_share_sheet&igsi=ZDNlZDc0MzIxNw=="
            target="_blank"
          >
            <i class="fa-brands fa-instagram"></i>
          </a>

          <a
            href="https://www.tiktok.com/@pessoalucas?_r=1&_t=ZS-999gOnDMJyp"
            target="_blank"
          >
            <i class="fa-brands fa-tiktok"></i>
          </a>

          <a href="https://www.facebook.com/pessoaartetattoo" target="_blank">
            <i class="fa-brands fa-facebook"></i>
          </a>
        </span>
      </div>
    </header>

    <!-- ================================================================
       HOME 
       ================================================================ -->
    <section class="hero" id="inicio">
      <div class="container-hero">
        <div class="pessoa-img">
          <img src="img/pessoa.png" alt="nome Pessôa" />
          <div class="texto-hero">
            <h1>Tatuagem fineline e blackwork</h1>
            <div class="linha"></div>
            <p>
              Do rascunho à cicatrização, a Pessôa Tattoo cuida de cada etapa do
              seu projeto.
            </p>
          </div>
        </div>
        <div class="lucas-img"><img src="img/lucas.png" alt="lucas" /></div>
        <div class="tatoo-img">
          <img src="img/tatoo.png" alt="tattoo" />
          <div class="texto-hero">
            <a href="https://wa.me/5524981190914" class="btn-hero"
              ><i class="fa-brands fa-whatsapp"></i>Agendar minha Tattoo</a
            >
            <p>Atendimento Exclusivo via WhatsApp</p>
          </div>
        </div>
      </div>
      <div class="local">
        <span> Petrópolis - RJ</span>
      </div>
    </section>

    <!-- ================= GALERIA ================= -->
    <section class="galeria" id="galeria">
      <h2 class="g-titulo">Galeria</h2>
      <div class="g-fio"></div>

      <div class="g-barra">
        <h3 class="g-sub">Trabalhos na pele</h3>

        <div class="g-filtros">
          <button class="is-ativo" data-filtro="todos">Todos</button>
          <button data-filtro="blackwork">Blackwork</button>
          <button data-filtro="fineline">Fineline</button>
          <button data-filtro="realismo">Realismo</button>
          <button data-filtro="lettering">Lettering</button>
        </div>
      </div>

      <div class="g-carrossel">
        <button class="g-seta g-prev" aria-label="Imagem anterior">
          &#8249;
        </button>

        <div class="g-trilho" id="gTrilho">
          <!-- TROQUE o src por: imagens/tattoo-01.jpg  (mantenha o data-cat) -->
          <figure class="g-item" data-cat="blackwork">
            <img
              src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 800'%3E%3Crect width='600' height='800' fill='%23141414'/%3E%3Ctext x='300' y='415' fill='%233a3a3a' font-family='serif' font-size='60' text-anchor='middle'%3E01%3C/text%3E%3C/svg%3E"
              alt="Tatuagem blackwork no braço"
              loading="lazy"
            />
            <figcaption>Blackwork — braço fechado</figcaption>
          </figure>

          <figure class="g-item" data-cat="fineline">
            <img
              src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 800'%3E%3Crect width='600' height='800' fill='%23141414'/%3E%3Ctext x='300' y='415' fill='%233a3a3a' font-family='serif' font-size='60' text-anchor='middle'%3E02%3C/text%3E%3C/svg%3E"
              alt="Tatuagem fineline no antebraço"
              loading="lazy"
            />
            <figcaption>Fineline — antebraço</figcaption>
          </figure>

          <figure class="g-item" data-cat="realismo">
            <img
              src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 800'%3E%3Crect width='600' height='800' fill='%23141414'/%3E%3Ctext x='300' y='415' fill='%233a3a3a' font-family='serif' font-size='60' text-anchor='middle'%3E03%3C/text%3E%3C/svg%3E"
              alt="Tatuagem realismo preto e cinza"
              loading="lazy"
            />
            <figcaption>Realismo — preto e cinza</figcaption>
          </figure>

          <figure class="g-item" data-cat="lettering">
            <img
              src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 800'%3E%3Crect width='600' height='800' fill='%23141414'/%3E%3Ctext x='300' y='415' fill='%233a3a3a' font-family='serif' font-size='60' text-anchor='middle'%3E04%3C/text%3E%3C/svg%3E"
              alt="Lettering gótico nas costas"
              loading="lazy"
            />
            <figcaption>Lettering — gótico</figcaption>
          </figure>

          <figure class="g-item" data-cat="blackwork">
            <img
              src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 800'%3E%3Crect width='600' height='800' fill='%23141414'/%3E%3Ctext x='300' y='415' fill='%233a3a3a' font-family='serif' font-size='60' text-anchor='middle'%3E05%3C/text%3E%3C/svg%3E"
              alt="Blackwork geométrico na perna"
              loading="lazy"
            />
            <figcaption>Blackwork — geométrico</figcaption>
          </figure>

          <figure class="g-item" data-cat="realismo">
            <img
              src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 800'%3E%3Crect width='600' height='800' fill='%23141414'/%3E%3Ctext x='300' y='415' fill='%233a3a3a' font-family='serif' font-size='60' text-anchor='middle'%3E06%3C/text%3E%3C/svg%3E"
              alt="Retrato realista no braço"
              loading="lazy"
            />
            <figcaption>Realismo — retrato</figcaption>
          </figure>

          <figure class="g-item" data-cat="fineline">
            <img
              src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 800'%3E%3Crect width='600' height='800' fill='%23141414'/%3E%3Ctext x='300' y='415' fill='%233a3a3a' font-family='serif' font-size='60' text-anchor='middle'%3E07%3C/text%3E%3C/svg%3E"
              alt="Traço fino floral"
              loading="lazy"
            />
            <figcaption>Fineline — floral</figcaption>
          </figure>

          <figure class="g-item" data-cat="blackwork">
            <img
              src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 800'%3E%3Crect width='600' height='800' fill='%23141414'/%3E%3Ctext x='300' y='415' fill='%233a3a3a' font-family='serif' font-size='60' text-anchor='middle'%3E08%3C/text%3E%3C/svg%3E"
              alt="Blackwork oriental"
              loading="lazy"
            />
            <figcaption>Blackwork — oriental</figcaption>
          </figure>
        </div>

        <button class="g-seta g-next" aria-label="Próxima imagem">
          &#8250;
        </button>
      </div>
    </section>
