<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendamentos — Black Ink Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/agendamentos.css?v=4">
</head>
<body>
<div class="grain"></div>

<header class="topbar">
  <a class="topbar__brand" href="/admin">
    <span class="topbar__logo" aria-hidden="true">
      <svg viewBox="0 0 32 44" fill="none">
        <path d="M16 2 L28 14 L22 20 L26 42 L16 30 L6 42 L10 20 L4 14 Z"
              fill="currentColor"/>
      </svg>
    </span>
    <div class="topbar__title">
      <h1>BLACK INK STUDIO</h1>
      <p>PAINEL ADMIN</p>
    </div>
  </a>

  <div class="topbar__nav">
    <button class="nav-arrow" id="prevWeek" aria-label="Semana anterior">&#8249;</button>
    <div class="nav-date">
      <svg class="nav-date__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span id="weekRangeText">--</span>
    </div>
    <button class="nav-arrow" id="nextWeek" aria-label="Pr&oacute;xima semana">&#8250;</button>
  </div>

  <div class="topbar__actions">
    <a class="btn-ghost" href="/admin">In&iacute;cio</a>
    <a class="btn-ghost" href="/admin/dashboard">Dashboard</a>
    <a class="btn-ghost" href="/admin/clientes">Clientes</a>
    <button class="btn-primary" id="openNewBtn">+ Novo agendamento</button>
  </div>
</header>

<main class="page">
  <aside class="sidebar">
    <div class="sidebar__intro">
      <span class="page-section__num">02.</span>
      <h2>Agendamentos</h2>
      <p>Confira os dias e hor&aacute;rios marcados do studio.</p>
    </div>

    <div class="mini-cal" id="miniCal"></div>

    <div class="sidebar__block">
      <span class="sidebar__title">Filtros</span>

      <div class="select-wrap">
        <span class="select-wrap__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21v-1a8 8 0 0 1 16 0v1"/>
          </svg>
        </span>
        <select id="filterArtist">
          <option value="all">Todos os artistas</option>
        </select>
        <span class="select-wrap__chev">&#9662;</span>
      </div>

      <div class="select-wrap">
        <span class="select-wrap__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <polyline points="12 7 12 12 16 14"/>
          </svg>
        </span>
        <select id="filterType">
          <option value="all">Todos os servi&ccedil;os</option>
        </select>
        <span class="select-wrap__chev">&#9662;</span>
      </div>

      <div class="select-wrap">
        <span class="select-wrap__icon">
          <span class="dot dot--green"></span>
        </span>
        <select id="filterStatus">
          <option value="all">Todos os status</option>
          <option value="confirmado">Confirmado</option>
          <option value="agendado">Aguardando</option>
          <option value="concluido">Conclu&iacute;do</option>
          <option value="cancelado">Cancelado</option>
        </select>
        <span class="select-wrap__chev">&#9662;</span>
      </div>
    </div>

    <div class="legend">
      <div class="legend__item"><span class="dot dot--red"></span> Confirmado</div>
      <div class="legend__item"><span class="dot dot--yellow"></span> Aguardando</div>
      <div class="legend__item"><span class="dot dot--green"></span> Conclu&iacute;do</div>
      <div class="legend__item"><span class="dot dot--gray"></span> Cancelado</div>
    </div>
  </aside>

  <section class="calendar">
    <div class="stats-row">
      <div class="stat-cell">
        <span class="stat-cell__label">Agendamentos</span>
        <span class="stat-cell__val" id="statAgendamentos">0</span>
        <span class="stat-cell__sub">esta semana</span>
      </div>
      <div class="stat-cell">
        <span class="stat-cell__label">Horas reservadas</span>
        <span class="stat-cell__val" id="statHoras">0h</span>
        <span class="stat-cell__sub">esta semana</span>
      </div>
      <div class="stat-cell">
        <span class="stat-cell__label">Taxa de ocupa&ccedil;&atilde;o</span>
        <span class="stat-cell__val stat-cell__val--accent" id="statOcup">0%</span>
        <span class="stat-cell__sub">m&eacute;dia semanal</span>
      </div>
    </div>

    <div class="week-grid" id="weekGrid"></div>
  </section>
</main>

<!-- Modal -->
<div class="modal" id="modal" hidden>
  <div class="modal__backdrop"></div>
  <div class="modal__panel">
    <div class="modal__header">
      <h2 id="modalTitle">Novo agendamento</h2>
      <button class="modal__close" id="modalClose">&times;</button>
    </div>
    <form id="agendForm" class="modal__body">
      <input type="hidden" id="agendId">

      <div class="field">
        <label for="cliente">Nome do cliente <span class="req">*</span></label>
        <input type="text" id="cliente" name="cliente" required>
      </div>

      <div class="grid-2">
        <div class="field">
          <label for="whatsapp">WhatsApp <span class="req">*</span></label>
          <input type="tel" id="whatsapp" name="whatsapp" required placeholder="(00) 00000-0000">
        </div>
        <div class="field">
          <label for="tipo">Servi&ccedil;o / Estilo</label>
          <select id="tipo" name="tipo">
            <option value="">Selecione...</option>
            <option>Realismo</option>
            <option>Fineline</option>
            <option>Blackwork</option>
            <option>Black &amp; Grey</option>
            <option>Floral</option>
            <option>Ornamental</option>
            <option>Old School</option>
            <option>Tradicional</option>
            <option>Piercing</option>
            <option>Retoque</option>
            <option>Or&ccedil;amento</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label for="data">Data <span class="req">*</span></label>
          <input type="date" id="data" name="data" required>
        </div>
        <div class="field">
          <label for="horario">Hor&aacute;rio <span class="req">*</span></label>
          <input type="time" id="horario" name="horario" required>
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label for="profissional">Profissional</label>
          <input type="text" id="profissional" name="profissional" list="artistsList">
          <datalist id="artistsList"></datalist>
        </div>
        <div class="field">
          <label for="duracao">Dura&ccedil;&atilde;o estimada</label>
          <input type="text" id="duracao" name="duracao" placeholder="Ex: 2h, 1h30, 30min">
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label for="valor">Valor (R$)</label>
          <input type="text" id="valor" name="valor" placeholder="0,00">
        </div>
        <div class="field">
          <label for="status">Status</label>
          <select id="status" name="status">
            <option value="agendado">Aguardando</option>
            <option value="confirmado">Confirmado</option>
            <option value="concluido">Conclu&iacute;do</option>
            <option value="cancelado">Cancelado</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="obs">Observa&ccedil;&otilde;es</label>
        <textarea id="obs" name="obs" rows="3" placeholder="Detalhes sobre o trabalho, refer&ecirc;ncias, etc."></textarea>
      </div>

      <div class="modal__footer">
        <button type="button" class="btn-ghost btn-danger" id="deleteBtn" hidden>Excluir</button>
        <button type="button" class="btn-ghost" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn-primary" id="saveBtn">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/agendamentos.js?v=4"></script>
</body>
</html>
